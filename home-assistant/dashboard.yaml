  # ---- 3: Dispense + Home buttons ----------------------------------------
  - type: horizontal-stack
    cards:
      - type: button
        name: Dispense Now
        icon: mdi:pill
        icon_height: 48px
        show_state: false
        tap_action:
          action: call-service
          service: script.pill_dispenser_dispense_now
      - type: button
        name: Home Drum
        icon: mdi:home-search
        icon_height: 48px
        show_state: false
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.pill_dispenser_home_drum

  # ---- 4: Last dispense ---------------------------------------------------
  - type: entities
    title: Last dispense
    show_header_toggle: false
    entities:
      - entity: input_datetime.pill_dispenser_last_dispense_at
        name: When
        icon: mdi:clock-check
      - entity: sensor.pill_dispenser_pills_dispensed
        name: Pill count
        icon: mdi:counter
      - entity: sensor.pill_dispenser_last_dispense_status
        name: Verification
        icon: mdi:check-circle
      - entity: number.pill_dispenser_pills_per_dose
        name: Expected per dose
        icon: mdi:pill
      - entity: input_boolean.pill_dispenser_dose_pending_ack
        name: Awaiting acknowledgement
      - type: call-service
        name: Acknowledge dose
        icon: mdi:check-bold
        action_name: Mark taken
        service: script.pill_dispenser_acknowledge_dose

  # ---- 5: Refill ---------------------------------------------------------
  - type: entities
    title: Refill
    show_header_toggle: false
    entities:
      - entity: sensor.pill_dispenser_compartments_remaining
        name: Compartments remaining
        icon: mdi:tray-full
      - entity: sensor.pill_dispenser_needs_refill
        name: Refill needed?
        icon: mdi:tray-alert
      - entity: input_number.pill_dispenser_last_refill_compartment
        name: Last refilled up to
        icon: mdi:tray-plus
      - type: call-service
        name: Mark fully refilled
        icon: mdi:tray-full
        action_name: Refill done
        service: input_number.set_value
        service_data:
          entity_id: input_number.pill_dispenser_last_refill_compartment
          value: 9

  # ---- 6: Schedule -------------------------------------------------------
  - type: entities
    title: Schedule
    show_header_toggle: false
    entities:
      - entity: input_boolean.pill_dispenser_morning_enabled
        name: Morning dose enabled
      - entity: input_datetime.pill_dispenser_morning_time
        name: Morning dose at
      - entity: input_boolean.pill_dispenser_evening_enabled
        name: Evening dose enabled
      - entity: input_datetime.pill_dispenser_evening_time
        name: Evening dose at
      - entity: switch.pill_dispenser_buzzer_mute
        name: Mute buzzer
