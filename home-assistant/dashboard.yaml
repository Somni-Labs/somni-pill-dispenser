# =============================================================================
# Pill Dispenser — Lovelace dashboard card
#
# Paste this into the Lovelace raw editor (or add to a YAML-mode dashboard).
# Uses only built-in HA cards — no HACS dependencies.
#
# Layout (top → bottom):
#   1. Header with current compartment + drum-homed status.
#   2. Drum position visualizer — 9 chips arranged in a 3×3 grid, the active
#      compartment is filled-in; spent compartments are dimmed; future
#      compartments are outlined.
#   3. Big "Dispense Now" button.
#   4. Last dispense info — time, pill count, OK/mismatch status.
#   5. Refill summary — compartments remaining + "Mark Refilled" action.
#   6. Schedule controls — morning/evening time + enable toggles.
# =============================================================================

type: vertical-stack
title: Pill Dispenser
cards:
  # ---- 1 + 2: Current compartment + visualizer ----------------------------
  - type: vertical-stack
    cards:
      - type: glance
        show_name: true
        show_state: true
        columns: 2
        entities:
          - entity: sensor.pill_dispenser_current_compartment
            name: Current compartment
            icon: mdi:target
          - entity: binary_sensor.pill_dispenser_drum_homed
            name: Homed

      - type: grid
        columns: 3
        square: true
        cards:
          - type: conditional
            conditions:
              - entity: sensor.pill_dispenser_current_compartment
                state: "1"
            card:
              type: button
              name: "1"
              icon: mdi:circle-slice-8
              entity: sensor.pill_dispenser_current_compartment
              tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id: button.pill_dispenser_dispense_compartment_1
          - type: conditional
            conditions:
              - entity: sensor.pill_dispenser_current_compartment
                state_not: "1"
            card:
              type: button
              name: "1"
              icon: mdi:circle-outline
              tap_action:
                action: call-service
                service: button.press
                target:
                  entity_id: button.pill_dispenser_dispense_compartment_1

